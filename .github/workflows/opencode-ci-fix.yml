name: OpenCode CI fix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: opencode-ci-fix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  fix:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Collect failed CI logs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log-failed > /tmp/opencode-ci-failure.log || true

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Ask OpenCode to fix CI
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PREVIOUS_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          attempt=1
          if [[ "$PREVIOUS_MESSAGE" =~ attempt-([0-9]+) ]]; then
            attempt=$((BASH_REMATCH[1] + 1))
          fi
          if [ "$attempt" -gt 3 ]; then
            echo "Maximum repair attempts reached"
            exit 1
          fi

          opencode run \
            --auto \
            --model opencode-go/gpt-5.6-luna \
            "Fix the CI failure described in /tmp/opencode-ci-failure.log.

            Inspect the repository and reproduce the failure where possible.
            Make the smallest correct code change.
            Follow the repository instructions and run the exact CI verification command: mise exec -- pnpm verify.
            Also run the most relevant targeted test or check.
            Do not claim verification passed unless the command exits successfully.
            Do not commit or push; leave the changes in the working tree." \
            --file /tmp/opencode-ci-failure.log

      - name: Commit and push repair to main
        id: commit
        env:
          PREVIOUS_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "OpenCode made no changes"
            exit 0
          fi

          attempt=1
          if [[ "$PREVIOUS_MESSAGE" =~ attempt-([0-9]+) ]]; then
            attempt=$((BASH_REMATCH[1] + 1))
          fi
          git config user.name "Pablo P Varela"
          git config user.email "pablo@pablopunk.com"
          git add -A
          git commit -m "fix: repair CI failure (attempt-$attempt)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Wait for CI verification
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          run_id=""
          for _ in {1..30}; do
            run_id=$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "CI run was not found for $SHA"
            exit 1
          fi
          gh run watch "$run_id" --exit-status

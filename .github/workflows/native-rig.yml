name: Native (Go) rig
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OUT: ${{ runner.temp }}/benchmark
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare evidence
        run: |
          mkdir -p "$OUT"
          cp .github/benchmarks/calibrate.sh "$OUT/"
          uname -a > "$OUT/machine.txt"
          lscpu >> "$OUT/machine.txt"
          free -h >> "$OUT/machine.txt"
          cat /proc/self/cgroup >> "$OUT/machine.txt"
          cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.stat >> "$OUT/machine.txt"
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox dbus-x11 xdotool xclip imagemagick libgtk-3-0 libsecret-1-0 libayatana-appindicator3-1 libwebkit2gtk-4.1-0 libgl1-mesa-dri libgbm1 unzip
      - name: Download and verify pinned packages
        run: |
          gh release download v2026.1031.2 -p 'Nevermind-2026.1031.2-linux-amd64.deb' -D "$OUT"
          gh api repos/pablopunk/nvm/actions/artifacts/14354039676/zip > "$OUT/native-linux-amd64.zip"
          cd "$OUT"
          printf '%s\n' '916b43cc87b556f983a562c849405aea644ac559e20c8f09fd66c7bdbd6ff655  Nevermind-2026.1031.2-linux-amd64.deb' 'c13355ac004a42677de574dd5c9bbdd23ed9c85e3c9a3d5cc56fce330db3c599  native-linux-amd64.zip' | sha256sum -c | tee checksums.txt
          unzip -l native-linux-amd64.zip > native-archive-list.txt
          mkdir v1 v2
          dpkg-deb -x Nevermind-2026.1031.2-linux-amd64.deb v1
          unzip -q native-linux-amd64.zip -d v2
          find v1 v2 -type f -printf '%p\n' > package-files.txt
      - name: Calibrate packaged applications
        run: dbus-run-session -- bash .github/benchmarks/calibrate.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-v1-v2-calibration
          path: |
            ${{ runner.temp }}/benchmark/*.txt
            ${{ runner.temp }}/benchmark/*.log
            ${{ runner.temp }}/benchmark/*.png
            ${{ runner.temp }}/benchmark/*.sh
          if-no-files-found: warn
          retention-days: 14

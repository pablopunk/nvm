name: Database migration

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Database environment to migrate
        required: true
        type: choice
        options:
          - development
          - preview
          - production
      approve_production:
        description: Approve the production schema change
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: database-migration-${{ github.event_name == 'workflow_run' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: database-${{ github.event_name == 'workflow_run' && 'production' || inputs.target }}
    steps:
      - name: Require production approval
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && !inputs.approve_production
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NVM_ENV: ${{ github.event_name == 'workflow_run' && 'production' || inputs.target }}
          NVM_DATABASE_ENV: ${{ github.event_name == 'workflow_run' && 'production' || inputs.target }}
          NVM_PRODUCTION_MIGRATION_APPROVED: ${{ github.event_name == 'workflow_run' && 'true' || inputs.approve_production }}
        run: mise exec -- pnpm -C src/backend db:migrate

      - name: Deploy Preview
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: mise exec -- pnpm dlx vercel@latest deploy --yes --token "$VERCEL_TOKEN"

      - name: Deploy production
        if: github.event_name == 'workflow_run' || inputs.target == 'production'
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: mise exec -- pnpm dlx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

name: macOS selected-text helper

on:
  pull_request:
    paths:
      - src/native/sidecar/macos-helper/**
      - src/native/scripts/natives/build-macos-helper.sh
      - .github/workflows/macos-selected-text.yml
  push:
    branches: [main]
    paths:
      - src/native/sidecar/macos-helper/**
      - src/native/scripts/natives/build-macos-helper.sh
      - .github/workflows/macos-selected-text.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile both supported macOS architectures
        working-directory: src/native
        run: |
          bash scripts/natives/build-macos-helper.sh arm64
          bash scripts/natives/build-macos-helper.sh amd64

name: Dev build

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate the dispatched branch without publishing a release or moving a pointer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-build
  queue: max

env:
  NIGHTLY_CLI: .github/scripts/nightly-release-cli.cjs

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      source_sha: ${{ steps.version.outputs.sha }}
      pointer_sha: ${{ steps.version.outputs.pointer_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Record source for failure diagnosis
        run: git rev-parse HEAD > dev-build-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dev-build-source-sha
          path: dev-build-source-sha.txt
          if-no-files-found: error
          retention-days: 30
      - name: Allocate version for source commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          plan="$(mise exec -- node .github/scripts/dev-version.cjs "$sha")"
          version="$(jq -r .version <<< "$plan")"
          build="$(jq -r .build <<< "$plan")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "pointer_sha=$(jq -r '.pointerSha // empty' <<< "$plan")" >> "$GITHUB_OUTPUT"
          if [[ "$build" == 'false' ]]; then
            echo 'No build-relevant changes; reusing the published dev release.'
          fi

  build:
    name: Build packages
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/native-package.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      release: true
      source_sha: ${{ needs.plan.outputs.source_sha }}
    secrets: inherit

  validate-assets:
    name: Validate assembled dev artifacts
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      UPDATE_PUBLIC_KEY: ${{ vars.NATIVE_UPDATE_PUBLIC_KEY }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: jdx/mise-action@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages
      - name: Assemble the release assets and point the manifests at the dev release
        run: |
          set -euo pipefail
          mise exec -- node "$NIGHTLY_CLI" assemble-assets --from packages --dir dist-nightly
          mise exec -- node "$NIGHTLY_CLI" retarget-metadata --dir dist-nightly --version "$VERSION" --tag "v${VERSION}-dev"
      - name: Validate every asset, manifest and signature
        run: mise exec -- node "$NIGHTLY_CLI" validate-assets --dir dist-nightly --version "$VERSION" --tag "v${VERSION}-dev" --public-key "$UPDATE_PUBLIC_KEY"

      - name: Create integrity manifest
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: mise exec -- node .github/scripts/promotion-manifest.cjs create dist-nightly manifest.json "$VERSION" "$SOURCE_SHA" "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-release
          path: dist-nightly/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: dev-manifest
          path: manifest.json
          if-no-files-found: error
          retention-days: 30

  publish-dev:
    name: Publish dev prerelease
    needs: [plan, validate-assets]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    concurrency:
      group: channel-promotion
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      UPDATE_PUBLIC_KEY: ${{ vars.NATIVE_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - uses: actions/download-artifact@v4
        with:
          name: dev-release
          path: dist-nightly
      - uses: actions/download-artifact@v4
        with:
          name: dev-manifest
          path: manifest
      - name: Verify staged assets and destination
        run: |
          set -euo pipefail
          mise exec -- node .github/scripts/promotion-manifest.cjs verify dist-nightly manifest/manifest.json "$VERSION" "$SOURCE_SHA" "$GITHUB_RUN_ID"
          mise exec -- node "$NIGHTLY_CLI" validate-assets --dir dist-nightly --version "$VERSION" --tag "v${VERSION}-dev" --public-key "$UPDATE_PUBLIC_KEY"
      - name: Create draft prerelease
        run: |
          set -euo pipefail
          tag="v${VERSION}-dev"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            [[ "$resolved" == "$SOURCE_SHA" ]] || { echo 'Draft tag points to another commit' >&2; exit 1; }
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')" == "$SOURCE_SHA" ]] || { echo "Tag points to another commit" >&2; exit 1; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          previous="$(git tag --merged "$SOURCE_SHA" --list 'v*-dev' --sort=-version:refname | head -n 1)"
          if [[ -n "$previous" ]]; then
            printf 'Changes since %s:\n\n' "$previous" > release-notes.md
            git log --format='- %s (%h)' "$previous..$SOURCE_SHA" >> release-notes.md
          else
            printf 'First dev build from %s.\n' "$SOURCE_SHA" > release-notes.md
          fi
          printf '\nSource: %s\nWorkflow run: %s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false \
            --title "Nevermind $VERSION (dev)" --notes-file release-notes.md \
            dist-nightly/* manifest/manifest.json
      - name: Verify remote bytes and publish
        run: |
          set -euo pipefail
          tag="v${VERSION}-dev"
          mkdir downloaded
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir downloaded
          mv downloaded/manifest.json remote-manifest.json
          cmp manifest/manifest.json remote-manifest.json
          mise exec -- node .github/scripts/promotion-manifest.cjs verify downloaded remote-manifest.json "$VERSION" "$SOURCE_SHA" "$GITHUB_RUN_ID"
          mise exec -- node "$NIGHTLY_CLI" validate-assets --dir downloaded --version "$VERSION" --tag "v${VERSION}-dev" --public-key "$UPDATE_PUBLIC_KEY"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          mise exec -- node .github/scripts/channel-pointer.cjs dev "$tag" "$SOURCE_SHA"

  repair-dev-pointer:
    name: Ensure existing dev release is available
    needs: plan
    if: needs.plan.outputs.build == 'false' && !inputs.dry_run
    runs-on: ubuntu-latest
    concurrency:
      group: channel-promotion
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.plan.outputs.pointer_sha }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: jdx/mise-action@v2
      - name: Repair pointer after an interrupted publication
        run: mise exec -- node .github/scripts/channel-pointer.cjs dev "v${VERSION}-dev" "$SOURCE_SHA"

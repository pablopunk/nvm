<!doctype html><html><head><meta charset="utf-8"><title>Memory, whole app</title><style>:root{--fg:#0a0a0a;--muted:#737373;--border:#e5e5e5;--v1:#a3a29b;--v2:#2a78d6;--tag-bg:#eaf2fc;--tag-fg:#184f95;--sans:"Geist","Geist Variable",Inter,-apple-system,"Helvetica Neue","Liberation Sans",Arial,sans-serif;--mono:"Geist Mono","SF Mono",Menlo,"Liberation Mono",monospace}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--fg);font:16px/1.5 var(--sans);width:900px}header{padding:36px 40px 26px;border-bottom:1px solid var(--border)}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}h1{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.2;margin:0}.legend{display:flex;gap:24px;margin:18px 0 0;padding:0;list-style:none;font-size:15px;font-weight:500}.legend li{display:flex;align-items:center;gap:8px}.legend small{color:var(--muted);font-size:15px;font-weight:400}.swatch{width:11px;height:11px;border-radius:3px}.panels{display:grid;gap:48px;padding:30px 40px 34px}h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}h2 span{color:var(--muted);font-weight:400}figure{margin:20px 0 0}figcaption{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;margin-bottom:4px}.tag{font-size:13px;font-weight:600;color:var(--tag-fg);background:var(--tag-bg);border-radius:999px;padding:1px 9px}.row{display:grid;grid-template-columns:34px 1fr 76px;gap:10px;align-items:center;padding:3px 0}.who{font-size:14px;color:var(--muted)}.track{height:12px}.bar{display:block;height:100%;border-radius:0 4px 4px 0}.val{text-align:right;font:15px var(--mono);font-variant-numeric:tabular-nums}.val.na{color:var(--muted)}footer{border-top:1px solid var(--border);padding:16px 40px 22px;font-size:14px;color:var(--muted)}</style></head><body><header><p class="eyebrow">Nevermind 1.x vs 2.x</p><h1>Memory, whole app</h1><ul class="legend"><li><span class="swatch" style="background:var(--v1)"></span>1.x <small>Electron</small></li><li><span class="swatch" style="background:var(--v2)"></span>2.x <small>Go</small></li></ul></header><main class="panels" style="grid-template-columns:repeat(1,minmax(0,1fr))"><section><h2>Linux</h2><figure><figcaption>Hidden<span class="tag">3.4× less</span></figcaption><div class="row" title="1.x · block medians 481–486 MiB · 10 blocks"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(85.35%,3px);background:var(--v1)"></span></span><span class="val">483 MiB</span></div><div class="row" title="2.x · block medians 131–146 MiB · 10 blocks"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(25.36%,3px);background:var(--v2)"></span></span><span class="val">143 MiB</span></div></figure><figure><figcaption>Open<span class="tag">3.2× less</span></figcaption><div class="row" title="1.x · block medians 452–460 MiB · 10 blocks"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(80.86%,3px);background:var(--v1)"></span></span><span class="val">457 MiB</span></div><div class="row" title="2.x · block medians 139–143 MiB · 10 blocks"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(25.09%,3px);background:var(--v2)"></span></span><span class="val">142 MiB</span></div></figure><figure><figcaption>Typing<span class="tag">3.8× less</span></figcaption><div class="row" title="1.x · block medians 520–557 MiB · 10 blocks"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(94.66%,3px);background:var(--v1)"></span></span><span class="val">535 MiB</span></div><div class="row" title="2.x · block medians 140–144 MiB · 10 blocks"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(25.16%,3px);background:var(--v2)"></span></span><span class="val">142 MiB</span></div></figure><figure><figcaption>After use<span class="tag">4× less</span></figcaption><div class="row" title="1.x · block medians 526–581 MiB · 10 blocks"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(100.00%,3px);background:var(--v1)"></span></span><span class="val">565 MiB</span></div><div class="row" title="2.x · block medians 139–143 MiB · 10 blocks"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(24.92%,3px);background:var(--v2)"></span></span><span class="val">141 MiB</span></div></figure></section></main><footer>Linux PSS · lower is better</footer></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Key press to result</title><style>:root{--fg:#0a0a0a;--muted:#737373;--border:#e5e5e5;--v1:#a3a29b;--v2:#2a78d6;--tag-bg:#eaf2fc;--tag-fg:#184f95;--sans:"Geist","Geist Variable",Inter,-apple-system,"Helvetica Neue","Liberation Sans",Arial,sans-serif;--mono:"Geist Mono","SF Mono",Menlo,"Liberation Mono",monospace}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--fg);font:16px/1.5 var(--sans);width:900px}header{padding:36px 40px 26px;border-bottom:1px solid var(--border)}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}h1{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.2;margin:0}.legend{display:flex;gap:24px;margin:18px 0 0;padding:0;list-style:none;font-size:15px;font-weight:500}.legend li{display:flex;align-items:center;gap:8px}.legend small{color:var(--muted);font-size:15px;font-weight:400}.swatch{width:11px;height:11px;border-radius:3px}.panels{display:grid;gap:48px;padding:30px 40px 34px}h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}h2 span{color:var(--muted);font-weight:400}figure{margin:20px 0 0}figcaption{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;margin-bottom:4px}.tag{font-size:13px;font-weight:600;color:var(--tag-fg);background:var(--tag-bg);border-radius:999px;padding:1px 9px}.row{display:grid;grid-template-columns:34px 1fr 76px;gap:10px;align-items:center;padding:3px 0}.who{font-size:14px;color:var(--muted)}.track{height:12px}.bar{display:block;height:100%;border-radius:0 4px 4px 0}.val{text-align:right;font:15px var(--mono);font-variant-numeric:tabular-nums}.val.na{color:var(--muted)}footer{border-top:1px solid var(--border);padding:16px 40px 22px;font-size:14px;color:var(--muted)}</style></head><body><header><p class="eyebrow">Nevermind 1.x vs 2.x</p><h1>Key press to result</h1><ul class="legend"><li><span class="swatch" style="background:var(--v1)"></span>1.x <small>Electron</small></li><li><span class="swatch" style="background:var(--v2)"></span>2.x <small>Go</small></li></ul></header><main class="panels" style="grid-template-columns:repeat(1,minmax(0,1fr))"><section><h2>Linux</h2><figure><figcaption>Search<span class="tag">3.7× faster</span></figcaption><div class="row" title="1.x · median 90–102 ms · p95 112 ms · 30 attempts"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(100.00%,3px);background:var(--v1)"></span></span><span class="val">96 ms</span></div><div class="row" title="2.x · median 20–32 ms · p95 32 ms · 30 attempts"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(26.96%,3px);background:var(--v2)"></span></span><span class="val">26 ms</span></div></figure><figure><figcaption>Clear<span class="tag">1.5× faster</span></figcaption><div class="row" title="1.x · median 80–92 ms · p95 104 ms · 30 attempts"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(89.80%,3px);background:var(--v1)"></span></span><span class="val">86 ms</span></div><div class="row" title="2.x · median 50–62 ms · p95 62 ms · 30 attempts"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(58.30%,3px);background:var(--v2)"></span></span><span class="val">56 ms</span></div></figure><figure><figcaption>Row down</figcaption><div class="row" title="1.x · median 0–12 ms · p95 22 ms · 30 attempts"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(6.07%,3px);background:var(--v1)"></span></span><span class="val">6 ms</span></div><div class="row" title="2.x · median 0–12 ms · p95 22 ms · 30 attempts"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(6.14%,3px);background:var(--v2)"></span></span><span class="val">6 ms</span></div></figure><figure><figcaption>Open Settings</figcaption><div class="row" title="1.x · median 10–22 ms · p95 22 ms · 30 attempts"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(16.54%,3px);background:var(--v1)"></span></span><span class="val">16 ms</span></div><div class="row" title="2.x · median 0–12 ms · p95 12 ms · 30 attempts"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(6.14%,3px);background:var(--v2)"></span></span><span class="val">6 ms</span></div></figure><figure><figcaption>Leave Settings</figcaption><div class="row" title="1.x · median 0–12 ms · p95 22 ms · 30 attempts"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(6.32%,3px);background:var(--v1)"></span></span><span class="val">6 ms</span></div><div class="row" title="2.x · median 0–12 ms · p95 32 ms · 30 attempts"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(6.11%,3px);background:var(--v2)"></span></span><span class="val">6 ms</span></div></figure><figure><figcaption>Calculator<span class="tag">4.2× faster</span></figcaption><div class="row" title="1.x · median 68 ms · p95 81 ms · 30 attempts"><span class="who">1.x</span><span class="track"><span class="bar" style="width:max(70.55%,3px);background:var(--v1)"></span></span><span class="val">68 ms</span></div><div class="row" title="2.x · median 16 ms · p95 17 ms · 30 attempts"><span class="who">2.x</span><span class="track"><span class="bar" style="width:max(16.83%,3px);background:var(--v2)"></span></span><span class="val">16 ms</span></div></figure></section></main><footer>Medians · screen timings use the midpoint of the median capture interval · lower is better</footer></body></html>

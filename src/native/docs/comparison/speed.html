<!doctype html><html><head><meta charset="utf-8"><style>
:root{--foreground:#18252d;--muted:#5d6a70;--card:#f2f5f6;--border:#d9e1e3;--primary:#007e72;--chart-1:#8b97ab;--chart-2:#008c7d;--radius:18px;--font-sans:Arial,sans-serif;--pele-bg:#ffffff;--pele-fg:#18252d;--pele-muted:#5d6a70;--pele-line:#87969c;--pele-surface:#f2f5f6;--pele-surface-alt:#e4f5f1;--pele-border:#d0dcdd}
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)} main{max-width:1160px;margin:0 auto} .eyebrow{color:var(--primary);letter-spacing:2px;font-size:13px;font-weight:700;margin:24px 0 12px}h1{font-size:44px;letter-spacing:-1.7px;margin:0} .intro{color:var(--muted);font-size:18px;margin:12px 0 24px;line-height:1.5}h2{font-size:21px;margin:0 0 14px}.panel{padding:24px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px} .architecture svg{display:block;width:100%;height:auto;max-height:285px}.legend{display:flex;gap:24px;font-size:13px;color:var(--muted);margin-bottom:20px}.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px}.row{display:grid;grid-template-columns:170px 1fr 110px;gap:15px;align-items:center;margin:18px 0}.label{font-size:15px;font-weight:600}.bar{height:28px;line-height:28px;padding-left:12px;border-radius:5px;color:white;font-size:13px;min-width:80px}.old{background:var(--chart-1)}.new{background:var(--chart-2);margin-top:5px}.saving{font-size:26px;font-weight:700;color:var(--primary)}small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:4px}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:16px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:var(--card);border-radius:12px;padding:18px}.number{font-size:32px;font-weight:700;color:var(--primary)}.stat p{font-size:13px;margin:8px 0 0;color:var(--muted);line-height:1.4}.footer{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:20px}a{color:var(--primary)} @media(max-width:600px){h1{font-size:32px}.panel{padding:16px}.row{grid-template-columns:100px 1fr 65px;gap:8px}.label{font-size:12px}.saving{font-size:22px}.stats{gap:7px}.stat{padding:10px}.number{font-size:25px}}
main{max-width:1084px;padding:8px} .panel{margin-bottom:0}</style></head><body><main><section class="panel"><h2>2.x responsiveness</h2><div class="stats"><div class="stat"><div class="number">40 ms</div><p>Hotkey → first frame<br>p95 · 60 ms budget</p></div><div class="stat"><div class="number">3.7 ms</div><p>Keystroke → results<br>p95 · 8 ms budget</p></div><div class="stat"><div class="number">196 ms</div><p>Launch → ready<br>400 ms budget</p></div></div><p class="note">Linux measurements from 3 Nov 2026. No comparable 1.x latency benchmark is reported in the PR.</p></section></main></body></html>
